<html lang="ar" dir="rtl">

    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <script>
      // المظهر قبل الرسم حتى لا يومض الفاتح في الوضع الغامق
      try { var t = localStorage.getItem('rq.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
