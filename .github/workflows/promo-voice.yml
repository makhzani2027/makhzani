# التعليق الصوتي للفيديو التعريفي (Gemini TTS) — يدوي: Actions ← Promo Voice ← Run workflow.
# الشرط: السر GEMINI_API_KEY (مفتاح Google AI Studio). المفتاح لا يُطبع ولا يُحفظ في المستودع.
# الناتج يُرفع إلى الفرع promo-assets (ملفات wav + المدد + تفريغ نصي للتحقق)، لا إلى الفرع الرئيسي.
#   samples: نفس الفقرة بعدة أصوات للاختيار.   full: ملف لكل مشهد بالصوت المختار.
name: Promo Voice
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'samples أو full'
        type: choice
        options: [samples, full]
        default: samples
      voice:
        description: 'اسم الصوت (لـ full)'
        default: 'Charon'
      model:
        description: 'نموذج TTS (فارغ = أحدث نموذج متاح)'
        default: ''
      voices:
        description: 'أصوات العيّنات (مفصولة بفواصل)'
        default: 'Charon,Orus,Algieba,Gacrux'
      chunks:
        description: 'عدد دفعات التوليد في full (الحصة المجانية ≈١٠ طلبات يومياً)'
        default: '4'

permissions:
  contents: write

concurrency:
  group: promo-voice
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Generate narration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODE: ${{ inputs.mode }}
          VOICE: ${{ inputs.voice }}
          MODEL: ${{ inputs.model }}
          SAMPLE_VOICES: ${{ inputs.voices }}
          TTS_CHUNKS: ${{ inputs.chunks }}
        run: |
          [ -n "$GEMINI_API_KEY" ] || { echo "::error::أضف السر GEMINI_API_KEY أولاً (Settings ← Secrets and variables ← Actions)."; exit 1; }
          if [ "$MODE" = samples ]; then
            python3 promo/tts.py samples out "$MODEL"
          else
            python3 promo/tts.py full out "$VOICE" "$MODEL"
          fi
          ls -la out
      - name: Push audio to the promo-assets branch
        # حتى لو توقف التوليد في المنتصف (الحصة) نرفع ما اكتمل
        if: always() && hashFiles('out/*.wav') != ''
        env:
          MODE: ${{ inputs.mode }}
          VOICE: ${{ inputs.voice }}
        run: |
          dest="voice/$MODE"; [ "$MODE" = full ] && dest="voice/full-$VOICE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          wt="$RUNNER_TEMP/promo-assets"
          if git ls-remote --exit-code --heads origin promo-assets >/dev/null 2>&1; then
            git fetch -q origin promo-assets
            git worktree add -q -B promo-assets "$wt" origin/promo-assets
          else
            git worktree add -q --detach "$wt"
            (cd "$wt" && git checkout -q --orphan promo-assets && git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +)
          fi
          rm -rf "$wt/$dest" && mkdir -p "$wt/$dest" && cp -r out/. "$wt/$dest/"
          cd "$wt" && git add -A && git commit -qm "Promo voice: $dest"
          ok=
          for i in 1 2 3 4; do if git push -q origin HEAD:refs/heads/promo-assets; then ok=1; break; fi; sleep $((i * 4)); done
          [ -n "$ok" ] || { echo "::error::تعذّر رفع الصوت إلى الفرع promo-assets"; exit 1; }
          echo "✓ promo-assets/$dest"
