# يُبقي مشروع Supabase المجاني نشطاً (يتوقف بعد ٧ أيام بلا نشاط): طلب قراءة بسيط كل ٣ أيام.
name: Keepalive
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::المتغيران SUPABASE_URL و SUPABASE_ANON_KEY غير مضبوطين — تخطّي."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' "${SUPABASE_URL%/}/rest/v1/app_settings?select=key&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          [ "$code" -lt 500 ] || { echo "::warning::Supabase أجاب بـ $code"; exit 1; }
