# ينشر آخر نسخة أندرويد مبنية (من Releases الخاصة) على مستودع الإصدارات العام — بلا إعادة بناء (دقيقة واحدة).
# يدوي: Actions ← Publish APK ← Run workflow. (Build Android ينشر على المستودع العام وحده بعد كل بناء.)
# الشرط: السر RELEASES_TOKEN (رمز GitHub بصلاحية Contents: Read and write على مستودع الإصدارات العام)،
# والمتغير الاختياري RELEASES_REPO (افتراضياً makhzani2027/raqeem-app).
name: Publish APK
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Copy the latest APK to the public releases repo
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO: ${{ vars.RELEASES_REPO || 'makhzani2027/raqeem-app' }}
        run: |
          [ -n "$PUBLIC_TOKEN" ] || { echo "::error::أضف السر RELEASES_TOKEN أولاً (انظر system/08-setup-guide.md)."; exit 1; }
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName,isPrerelease \
            --jq '[.[] | select(.tagName|startswith("android-")) | select(.isPrerelease|not)][0].tagName')
          [ -n "$tag" ] || { echo "::error::لا توجد نسخة أندرويد في Releases — شغّل Build Android."; exit 1; }
          # مستودع فارغ (بلا README) لا يقبل إصدارات: ننشئ أول ملف فيه
          if ! GH_TOKEN="$PUBLIC_TOKEN" gh api "repos/$REPO/commits?per_page=1" >/dev/null 2>&1; then
            GH_TOKEN="$PUBLIC_TOKEN" gh api -X PUT "repos/$REPO/contents/README.md" -f message="Add README" \
              -f content="$(printf '%s\n' '# رقيم — تطبيق أندرويد' '' 'تنزيل آخر نسخة: https://github.com/'"$REPO"'/releases/latest/download/raqeem.apk' | base64 -w0)" >/dev/null
            echo "✓ أُنشئ README في $REPO"
          fi
          mkdir -p out
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'raqeem*.apk' --dir out
          ls -lh out
          v="v1.0.${tag#android-}"
          if GH_TOKEN="$PUBLIC_TOKEN" gh release view "$v" --repo "$REPO" >/dev/null 2>&1; then
            GH_TOKEN="$PUBLIC_TOKEN" gh release upload "$v" out/*.apk --repo "$REPO" --clobber
          else
            printf '%s\n' \
              "- raqeem.apk — لأغلب الهواتف (64 بت)." \
              "- raqeem-armv7.apk — للهواتف القديمة (32 بت) إن لم يُثبَّت الأول." \
              "" "يُثبَّت فوق النسخة السابقة دون فقدان البيانات." > notes.md
            GH_TOKEN="$PUBLIC_TOKEN" gh release create "$v" out/*.apk --repo "$REPO" \
              --title "رقيم لأندرويد ${v}" --notes-file notes.md --latest
          fi
          echo "✓ https://github.com/$REPO/releases/latest/download/raqeem.apk"

      - name: Remove the old copy from Supabase Storage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then exit 0; fi
          keys=$(curl -sSf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true")
          KEY=$(echo "$keys" | jq -r '[.[] | select(.name=="service_role")][0].api_key // empty')
          [ -n "$KEY" ] || KEY=$(echo "$keys" | jq -r '[.[] | select(.type=="secret")][0].api_key // empty')
          [ -n "$KEY" ] || exit 0
          echo "::add-mask::$KEY"
          curl -sS -o /dev/null -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
            -X DELETE "https://$PROJECT_REF.supabase.co/storage/v1/object/downloads" \
            -d '{"prefixes":["raqeem.apk","raqeem-armv7.apk"]}' || true
          echo "✓ حُذفت نسخة Supabase (التنزيل الآن من GitHub)."

      - name: Point the website download button to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
