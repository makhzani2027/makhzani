# ينشر الموقع التعريفي + لوحة التحكم على Firebase Hosting:
#   https://raqeem-iq.web.app/            الموقع (والصفحات القانونية و /p/<slug> لمشاركة المنتجات)
#   https://raqeem-iq.web.app/dashboard/  لوحة التحكم
# السر: FIREBASE_SERVICE_ACCOUNT. المتغيرات (عامة): SUPABASE_URL, SUPABASE_ANON_KEY, MEDIA_BASE_URL, FIREBASE_PROJECT_ID (افتراضياً raqeem-iq)،
# واختيارياً DOWNLOAD_URL / DOWNLOAD_VERSION / DOWNLOAD_SIZE_MB لزر تنزيل APK.
name: Deploy Site
on:
  workflow_dispatch:
  push:
    branches: [main, claude/happy-rubin-s67gcc]
    paths:
      - 'apps/site/**'
      - 'apps/admin/**'
      - 'packages/shared/**'
      - 'brand/**'
      - 'assets/fonts/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'scripts/build-hosting.sh'
      - 'scripts/build-site.mjs'
      - 'scripts/check-hosting.mjs'
      - 'package-lock.json'
      - '.github/workflows/deploy-site.yml'

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # آخر نسخة أندرويد (يبنيها «Build Android» ويرفعها إلى مخزن Supabase العام downloads/raqeem.apk):
      # نقرأ رقمها وحجمها من Releases لزر التنزيل في الموقع
      - name: Latest Android APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          REPO: ${{ vars.RELEASES_REPO || 'makhzani2027/raqeem-app' }}
        run: |
          mb() { awk -v b="$1" 'BEGIN{printf "%.0f", b/1048576}'; }
          # ١) مستودع الإصدارات العام على GitHub: رابط ثابت لآخر نسخة
          rel=$(gh release view --repo "$REPO" --json tagName,assets 2>/dev/null || true)
          if [ -n "$rel" ]; then
            tag=$(echo "$rel" | jq -r '.tagName')
            size=$(echo "$rel" | jq -r '.assets[] | select(.name=="raqeem.apk") | .size')
            url="https://github.com/$REPO/releases/latest/download/raqeem.apk"
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            [ -n "$size" ] && echo "size=$(mb "$size")" >> "$GITHUB_OUTPUT"
            echo "APK (GitHub): $tag → $url"; exit 0
          fi
          # ٢) احتياط: مخزن Supabase العام (قبل إنشاء مستودع الإصدارات)
          [ -n "$SUPABASE_URL" ] || exit 0
          list=$(gh release list --limit 30 --json tagName,isPrerelease 2>/dev/null || echo '[]')
          tag=$(echo "$list" | jq -r '[.[] | select(.tagName|startswith("android-")) | select(.isPrerelease|not)][0].tagName // empty')
          if [ -z "$tag" ]; then echo "::notice::لا توجد نسخة أندرويد بعد — زر التنزيل يبقى «قريباً»."; exit 0; fi
          url="${SUPABASE_URL%/}/storage/v1/object/public/downloads/raqeem.apk"
          code=$(curl -s -o /dev/null -w '%{http_code}' -I "$url")
          if [ "$code" != 200 ]; then echo "::notice::الملف غير موجود بعد في مخزن التنزيل ($code)."; exit 0; fi
          size=$(gh release view "$tag" --json assets --jq '.assets[] | select(.name=="raqeem.apk") | .size')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "version=1.0.${tag#android-}" >> "$GITHUB_OUTPUT"
          [ -n "$size" ] && echo "size=$(mb "$size")" >> "$GITHUB_OUTPUT"
          echo "APK (Supabase): $tag → $url"

      - name: Build site + dashboard
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          DOWNLOAD_URL: ${{ vars.DOWNLOAD_URL || steps.apk.outputs.url }}
          DOWNLOAD_VERSION: ${{ vars.DOWNLOAD_VERSION || steps.apk.outputs.version }}
          DOWNLOAD_SIZE_MB: ${{ vars.DOWNLOAD_SIZE_MB || steps.apk.outputs.size }}
        run: |
          [ -n "$SUPABASE_URL" ] || echo "::notice::المتغير SUPABASE_URL غير مضبوط — الموقع بلا بيانات حية ولوحة التحكم في وضع العرض."
          bash scripts/build-hosting.sh

      - uses: actions/upload-artifact@v4
        with:
          name: hosting
          path: hosting
          retention-days: 7

      - name: Skip notice
        if: env.HAS_FIREBASE != 'true'
        run: echo "::notice::السر FIREBASE_SERVICE_ACCOUNT غير مضاف — بُني الموقع (artifact hosting) ولم يُنشر."

      - name: Deploy to Firebase Hosting
        if: env.HAS_FIREBASE == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID || 'raqeem-iq' }}
          channelId: live
