# ينشر الموقع التعريفي + لوحة التحكم على Firebase Hosting:
#   https://raqeem-iq.web.app/            الموقع (والصفحات القانونية و /p/<slug> لمشاركة المنتجات)
#   https://raqeem-iq.web.app/dashboard/  لوحة التحكم
# السر: FIREBASE_SERVICE_ACCOUNT. المتغيرات (عامة): SUPABASE_URL, SUPABASE_ANON_KEY, MEDIA_BASE_URL, FIREBASE_PROJECT_ID (افتراضياً raqeem-iq)،
# واختيارياً DOWNLOAD_URL / DOWNLOAD_VERSION / DOWNLOAD_SIZE_MB لزر تنزيل APK.
name: Deploy Site
on:
  workflow_dispatch:
  push:
    branches: [main, claude/happy-rubin-s67gcc]
    paths:
      - 'apps/site/**'
      - 'apps/admin/**'
      - 'packages/shared/**'
      - 'brand/**'
      - 'assets/fonts/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'scripts/build-hosting.sh'
      - 'scripts/build-site.mjs'
      - 'scripts/check-hosting.mjs'
      - 'package-lock.json'
      - '.github/workflows/deploy-site.yml'

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # آخر APK من Releases (يبنيه «Build Android») يُنشر مع الموقع على /download/raqeem.apk —
      # المستودع خاص فروابط Releases لا تفتح للزبائن. نفضّل النسخة الموقّعة بمفتاح رقيم.
      - name: Latest Android APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          list=$(gh release list --limit 30 --json tagName,isPrerelease 2>/dev/null || echo '[]')
          tag=$(echo "$list" | jq -r '[.[] | select(.tagName|startswith("android-")) | select(.isPrerelease|not)][0].tagName // empty')
          [ -n "$tag" ] || tag=$(echo "$list" | jq -r '[.[] | select(.tagName|startswith("android-"))][0].tagName // empty')
          if [ -z "$tag" ]; then echo "::notice::لا توجد نسخة أندرويد في Releases بعد — زر التنزيل يبقى «قريباً»."; exit 0; fi
          gh release download "$tag" --pattern raqeem.apk --dir "$RUNNER_TEMP/apk" --clobber
          f="$RUNNER_TEMP/apk/raqeem.apk"
          echo "file=$f" >> "$GITHUB_OUTPUT"
          echo "version=1.0.${tag#android-}" >> "$GITHUB_OUTPUT"
          echo "size=$(awk -v b="$(stat -c %s "$f")" 'BEGIN{printf "%.0f", b/1048576}')" >> "$GITHUB_OUTPUT"
          echo "APK: $tag ($(du -h "$f" | cut -f1))"

      - name: Build site + dashboard
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          DOWNLOAD_URL: ${{ vars.DOWNLOAD_URL || (steps.apk.outputs.file && '/download/raqeem.apk') || '' }}
          DOWNLOAD_VERSION: ${{ vars.DOWNLOAD_VERSION || steps.apk.outputs.version }}
          DOWNLOAD_SIZE_MB: ${{ vars.DOWNLOAD_SIZE_MB || steps.apk.outputs.size }}
        run: |
          [ -n "$SUPABASE_URL" ] || echo "::notice::المتغير SUPABASE_URL غير مضبوط — الموقع بلا بيانات حية ولوحة التحكم في وضع العرض."
          bash scripts/build-hosting.sh

      - name: Add APK to the site
        if: steps.apk.outputs.file != ''
        run: |
          mkdir -p hosting/download
          cp "${{ steps.apk.outputs.file }}" hosting/download/raqeem.apk
          ls -lh hosting/download

      - uses: actions/upload-artifact@v4
        with:
          name: hosting
          path: |
            hosting
            !hosting/download/*.apk
          retention-days: 7

      - name: Skip notice
        if: env.HAS_FIREBASE != 'true'
        run: echo "::notice::السر FIREBASE_SERVICE_ACCOUNT غير مضاف — بُني الموقع (artifact hosting) ولم يُنشر."

      - name: Deploy to Firebase Hosting
        if: env.HAS_FIREBASE == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID || 'raqeem-iq' }}
          channelId: live
