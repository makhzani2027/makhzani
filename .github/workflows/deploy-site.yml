# ينشر الموقع التعريفي + لوحة التحكم على Firebase Hosting:
#   https://raqeem-iq.web.app/            الموقع (والصفحات القانونية و /p/<slug> لمشاركة المنتجات)
#   https://raqeem-iq.web.app/dashboard/  لوحة التحكم
# السر: FIREBASE_SERVICE_ACCOUNT. المتغيرات (عامة): SUPABASE_URL, SUPABASE_ANON_KEY, MEDIA_BASE_URL, FIREBASE_PROJECT_ID (افتراضياً raqeem-iq)،
# واختيارياً DOWNLOAD_URL / DOWNLOAD_VERSION / DOWNLOAD_SIZE_MB لزر تنزيل APK.
name: Deploy Site
on:
  workflow_dispatch:
  push:
    branches: [main, claude/happy-rubin-s67gcc]
    paths:
      - 'apps/site/**'
      - 'apps/admin/**'
      - 'packages/shared/**'
      - 'brand/**'
      - 'assets/fonts/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'scripts/build-hosting.sh'
      - 'scripts/build-site.mjs'
      - 'scripts/check-hosting.mjs'
      - 'package-lock.json'
      - '.github/workflows/deploy-site.yml'

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build site + dashboard
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          DOWNLOAD_URL: ${{ vars.DOWNLOAD_URL }}
          DOWNLOAD_VERSION: ${{ vars.DOWNLOAD_VERSION }}
          DOWNLOAD_SIZE_MB: ${{ vars.DOWNLOAD_SIZE_MB }}
        run: |
          [ -n "$SUPABASE_URL" ] || echo "::notice::المتغير SUPABASE_URL غير مضبوط — الموقع بلا بيانات حية ولوحة التحكم في وضع العرض."
          bash scripts/build-hosting.sh

      - uses: actions/upload-artifact@v4
        with:
          name: hosting
          path: hosting
          retention-days: 7

      - name: Skip notice
        if: env.HAS_FIREBASE != 'true'
        run: echo "::notice::السر FIREBASE_SERVICE_ACCOUNT غير مضاف — بُني الموقع (artifact hosting) ولم يُنشر."

      - name: Deploy to Firebase Hosting
        if: env.HAS_FIREBASE == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID || 'raqeem-iq' }}
          channelId: live
