# رقيم لسطح المكتب (ويندوز، بلا إنترنت):
#   test  : لينكس — البوابة + Postgres المضمّن + PostgREST الحقيقي + اختبار شامل للواجهة (إنشاء حساب، منتج، بيع، عرض، نسخة، عزل الحسابات، إعادة التشغيل)
#   build : ويندوز — فحص تشغيل الخلفية على ويندوز ثم بناء ملف التثبيت Raqeem-Setup.exe
#   publish (يدوي فقط): نشر الملف في مستودع الإصدارات العام برابط ثابت
name: Desktop
on:
  push:
    branches: [main, claude/happy-rubin-s67gcc]
    paths: ['desktop/**', 'apps/admin/**', 'packages/shared/**', 'supabase/migrations/**', 'supabase/seed.sql', 'supabase/tests/supabase_stub.sql', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'نشر ملف التثبيت للتنزيل (نعم/لا)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  POSTGREST_VERSION: v12.2.12

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Desktop deps (without Electron)
        working-directory: desktop
        run: npm ci --omit=dev
      - name: Resources (sql + admin)
        working-directory: desktop
        env:
          ONLINE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          ONLINE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: node scripts/prepare.mjs --admin
      - name: PostgREST
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # اسم الملف يُقرأ من واجهة GitHub (بالرمز: لا حدّ للطلبات) بدل تخمينه
          url=$(curl -sS --fail-with-body -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/PostgREST/postgrest/releases/tags/$POSTGREST_VERSION" \
            | jq -r '.assets[] | select(.name | test("linux-static-x(86-)?64\\.tar\\.xz$")) | .browser_download_url' | head -1)
          [ -n "$url" ] || { echo "::error::no linux asset for PostgREST $POSTGREST_VERSION"; exit 1; }
          echo "PostgREST: $url"
          for i in 1 2 3; do curl -sSfL --retry 3 -o /tmp/pgrst.tar.xz "$url" && break; sleep 5; done
          tar -xf /tmp/pgrst.tar.xz -C resources/bin && chmod +x resources/bin/postgrest && resources/bin/postgrest --version
      - name: Playwright
        run: |
          npm i --no-save playwright@1.49.1 --prefix desktop
          for i in 1 2 3; do npx --prefix desktop playwright install --with-deps chromium && exit 0; echo "retry $i"; sleep 20; done; exit 1
      - name: E2E — first run
        working-directory: desktop
        run: |
          RAQEEM_ROOT=$RUNNER_TEMP/raqeem RAQEEM_DEBUG=1 node server/cli.mjs 47831 > $RUNNER_TEMP/gw1.log 2>&1 &
          echo $! > $RUNNER_TEMP/gw.pid
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:47831/local/state >/dev/null && break; sleep 0.5; done
          SHOTS=$RUNNER_TEMP/shots node e2e/flow.mjs first || { tail -60 $RUNNER_TEMP/gw1.log; exit 1; }
          kill -INT $(cat $RUNNER_TEMP/gw.pid); sleep 3
      - name: E2E — after restart (+ account from the first release gets its database updated)
        working-directory: desktop
        run: |
          # كأن الحساب أُنشئ بالإصدار الأول (بلا قائمة تحديثات): الفتح يطبّق تحديثات القاعدة الأحدث
          for f in $RUNNER_TEMP/raqeem/*/account.json; do node -e "const fs=require('fs');const f=process.argv[1];const a=JSON.parse(fs.readFileSync(f));delete a.migrations;fs.writeFileSync(f,JSON.stringify(a))" "$f"; done
          RAQEEM_ROOT=$RUNNER_TEMP/raqeem RAQEEM_DEBUG=1 node server/cli.mjs 47831 > $RUNNER_TEMP/gw2.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:47831/local/state >/dev/null && break; sleep 0.5; done
          SHOTS=$RUNNER_TEMP/shots node e2e/flow.mjs second || { tail -60 $RUNNER_TEMP/gw2.log; exit 1; }
          grep -q "upgrade: 20261107000029_platform_settings.sql" $RUNNER_TEMP/gw2.log || { echo "::error::account database was not updated"; tail -40 $RUNNER_TEMP/gw2.log; exit 1; }
          ls -la $RUNNER_TEMP/raqeem/*/
      - name: Inspector 3 — open every page and record errors
        working-directory: desktop
        continue-on-error: true
        run: SHOTS=$RUNNER_TEMP/shots node e2e/crawl.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: desktop-e2e-shots, path: '${{ runner.temp }}/shots', retention-days: 7, if-no-files-found: ignore }

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Desktop deps
        working-directory: desktop
        shell: bash
        # تنزيل Electron قد يفشل مؤقتاً (5xx من الخادم): ثلاث محاولات
        run: for i in 1 2 3; do npm ci && exit 0; echo "retry $i"; sleep 20; done; exit 1
      - name: Resources (sql + admin)
        working-directory: desktop
        env:
          ONLINE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          ONLINE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: node scripts/prepare.mjs --admin
      - name: PostgREST for Windows
        working-directory: desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/PostgREST/postgrest/releases/tags/$env:POSTGREST_VERSION" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'raqeem' }
          $asset = $rel.assets | Where-Object { $_.name -match 'windows' -and $_.name -like '*.zip' } | Select-Object -First 1
          if (-not $asset) { $rel.assets | ForEach-Object { $_.name }; throw 'no windows asset' }
          Write-Host "PostgREST: $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\pgrst.zip"
          Expand-Archive "$env:RUNNER_TEMP\pgrst.zip" -DestinationPath resources\bin -Force
          Get-ChildItem resources\bin
          & resources\bin\postgrest.exe --version
      - name: Smoke test on Windows (database + API start, account works)
        working-directory: desktop
        shell: pwsh
        run: |
          $env:RAQEEM_ROOT = "$env:RUNNER_TEMP\raqeem"
          $env:RAQEEM_DEBUG = '1'
          $p = Start-Process node -ArgumentList 'server/cli.mjs','47831' -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\gw.log" -RedirectStandardError "$env:RUNNER_TEMP\gw.err"
          Start-Sleep 3
          trap { Write-Host '----- gateway log'; Get-Content "$env:RUNNER_TEMP\gw.log","$env:RUNNER_TEMP\gw.err" -ErrorAction SilentlyContinue; Get-ChildItem "$env:RUNNER_TEMP\raqeem" -Recurse -Filter postgres.log | ForEach-Object { Write-Host "----- $($_.FullName)"; Get-Content $_.FullName -Tail 40 }; break }
          $c = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:47831/local/create -ContentType 'application/json' -Body (@{ name = 'Smoke Store'; password = '1234' } | ConvertTo-Json)
          $s = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:47831/local/open -ContentType 'application/json' -Body (@{ id = $c.id; password = '1234' } | ConvertTo-Json)
          $wh = Invoke-RestMethod -Uri 'http://127.0.0.1:47831/rest/v1/warehouses?select=id,name' -Headers @{ Authorization = "Bearer $($s.access_token)" }
          if (-not $wh -or $wh.Count -lt 1) { Get-Content "$env:RUNNER_TEMP\gw.log","$env:RUNNER_TEMP\gw.err"; throw 'no warehouses' }
          $b = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:47831/local/backup -Headers @{ Authorization = "Bearer $($s.access_token)" } -ContentType 'application/json' -Body '{}'
          if (-not (Test-Path $b.file)) { throw 'backup missing' }
          Write-Host "OK: account $($c.id), warehouses $($wh.Count), backup $($b.file)"
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:47831/local/close -ContentType 'application/json' -Body '{}' | Out-Null
          Stop-Process -Id $p.Id -Force
      - name: Version (1.0.<run number>) — the installed app updates itself to newer versions
        working-directory: desktop
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Smoke test the built app (Electron window + local server)
        shell: pwsh
        working-directory: desktop
        run: |
          $exe = Get-ChildItem dist\win-unpacked\*.exe | Select-Object -First 1
          $env:RAQEEM_ROOT = "$env:RUNNER_TEMP\raqeem-app"
          # كحاسوب عادي: لا PostgreSQL ولا Git ولا أدوات المطوّرين في PATH (جهاز الاختبار فيه مكتبات لا توجد عند المستخدمين)
          $env:PATH = 'C:\Windows\System32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0'
          $app = Start-Process $exe.FullName -PassThru -RedirectStandardError "$env:RUNNER_TEMP\app.err" -RedirectStandardOutput "$env:RUNNER_TEMP\app.out"
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 1
            try { $st = Invoke-RestMethod http://127.0.0.1:47831/local/state; $ok = $true; break } catch { }
          }
          if (-not $ok) { Get-Content "$env:APPDATA\Raqeem\raqeem.log","$env:RUNNER_TEMP\app.err","$env:RUNNER_TEMP\app.out" -ErrorAction SilentlyContinue; throw 'the app did not start its local server' }
          Write-Host '----- self-check (as on a user PC)'
          Invoke-RestMethod http://127.0.0.1:47831/local/diagnostics | Select-Object version, platform, root_writable, postgrest_exists, postgrest_version, pg_ctl_version | Format-List | Out-String | Write-Host
          $page = Invoke-WebRequest http://127.0.0.1:47831/ -UseBasicParsing
          if ($page.Content -notmatch '/local/config.js') { throw 'dashboard not served' }
          $c = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:47831/local/create -ContentType 'application/json' -Body (@{ name = 'App Smoke'; password = '1234' } | ConvertTo-Json)
          $s = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:47831/local/open -ContentType 'application/json' -Body (@{ id = $c.id; password = '1234' } | ConvertTo-Json)
          $wh = Invoke-RestMethod -Uri 'http://127.0.0.1:47831/rest/v1/warehouses?select=id' -Headers @{ Authorization = "Bearer $($s.access_token)" }
          if (-not $wh) { throw 'no data from the app' }
          Write-Host "OK: the installed app runs; root $($st.root); account $($c.id)"
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Get-Process postgres, postgrest -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Installer
        shell: pwsh
        working-directory: desktop
        run: |
          $f = Get-Item dist\Raqeem-Setup.exe
          "{0:N1} MB" -f ($f.Length / 1MB)
          if (-not (Test-Path dist\latest.yml)) { throw 'latest.yml missing (auto-update)' }
          Get-Content dist\latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: Raqeem-Setup
          retention-days: 30
          path: |
            desktop/dist/Raqeem-Setup.exe
            desktop/dist/Raqeem-Setup.exe.blockmap
            desktop/dist/latest.yml

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with: { name: Raqeem-Setup, path: out }
      - name: Publish to the public releases repo (fixed link)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO: ${{ vars.RELEASES_REPO || 'makhzani2027/raqeem-app' }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::السر RELEASES_TOKEN غير مضاف."; exit 1; }
          ls -lh out
          if gh release view desktop --repo "$REPO" >/dev/null 2>&1; then
            # الملف أولاً ثم latest.yml: البرامج المثبّتة لا ترى التحديث قبل اكتمال رفعه
            gh release upload desktop out/Raqeem-Setup.exe out/Raqeem-Setup.exe.blockmap --repo "$REPO" --clobber
            gh release upload desktop out/latest.yml --repo "$REPO" --clobber
          else
            printf '%s\n' 'رقيم لسطح المكتب (ويندوز) — يعمل بلا إنترنت، وبياناتك على حاسوبك.' '' \
              'عند أول تشغيل قد يظهر «Windows protected your PC»: اضغط More info ثم Run anyway.' > notes.md
            gh release create desktop out/Raqeem-Setup.exe out/Raqeem-Setup.exe.blockmap out/latest.yml --repo "$REPO" --title 'رقيم لسطح المكتب (ويندوز)' --notes-file notes.md --latest=false
          fi
          echo "✓ https://github.com/$REPO/releases/download/desktop/Raqeem-Setup.exe"
