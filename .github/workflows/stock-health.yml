# تقارير سلامة البيانات (قراءة فقط، لا تغيّر شيئاً): Actions ← Stock Health ← Run workflow.
name: Stock Health
on:
  workflow_dispatch:
    inputs:
      report:
        description: 'التقرير: stock_health أو data_health'
        required: true
        default: 'data_health'
        type: choice
        options: [data_health, stock_health, probe_roles]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: |
          jq -n --arg q "$(cat supabase/maintenance/${{ inputs.report }}.sql)" '{query: $q}' | curl -sS --fail-with-body -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @- | jq '.[0] | to_entries[0].value'
