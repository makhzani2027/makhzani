# يبني تطبيق رقيم لأندرويد (APK للتنزيل المباشر + AAB لـ Google Play) وينشرهما في Releases باسم android-<رقم التشغيل>.
# يدوي فقط: Actions ← Build Android ← Run workflow.
# التوقيع: signing/raqeem-release.keystore.enc (من «Create Signing Key») مع السر SIGNING_PASSPHRASE؛ بدونه يُبنى بمفتاح debug مع تحذير.
# متغيرات عامة: SUPABASE_URL, SUPABASE_ANON_KEY, MEDIA_BASE_URL, SITE_URL. سر اختياري: GOOGLE_SERVICES_JSON (الإشعارات).
name: Build Android
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: build-android
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APK_BUILD: ${{ github.run_number }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_MEDIA_BASE: ${{ vars.MEDIA_BASE_URL }}
      EXPO_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Check configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::أضف SUPABASE_URL و SUPABASE_ANON_KEY في Settings ← Secrets and variables ← Actions ← تبويب Variables (ليس Secrets). بدونها يُبنى التطبيق في وضع العرض غير مربوط بقاعدة البيانات."
            exit 1
          fi
          [ -n "$GOOGLE_SERVICES_JSON" ] || echo "::warning::السر GOOGLE_SERVICES_JSON غير مضاف — النسخة بلا إشعارات فورية."

      - name: Generate Android project (expo prebuild)
        working-directory: apps/mobile
        env:
          CI: 1
          # app.config.ts يكتب google-services.json من هذا المتغير
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: npx expo prebuild --platform android --no-install --clean

      - name: One APK per phone processor (arm64 + armv7)
        run: node scripts/android-abi-splits.js

      - name: Release signing
        id: sign
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          ENC=signing/raqeem-release.keystore.enc
          if [ -f "$ENC" ] && [ -n "$SIGNING_PASSPHRASE" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SIGNING_PASSPHRASE -in "$ENC" -out "$RUNNER_TEMP/raqeem.keystore"
            # كلمة السر لا تُكتب في GITHUB_ENV؛ تُمرَّر لخطوة البناء وحدها
            echo "RAQEEM_KEYSTORE=$RUNNER_TEMP/raqeem.keystore" >> "$GITHUB_ENV"
            echo "RAQEEM_KEY_ALIAS=raqeem" >> "$GITHUB_ENV"
            RAQEEM_KEYSTORE="$RUNNER_TEMP/raqeem.keystore" RAQEEM_KEY_ALIAS=raqeem \
              RAQEEM_STORE_PASSWORD="$SIGNING_PASSPHRASE" RAQEEM_KEY_PASSWORD="$SIGNING_PASSPHRASE" node scripts/apply-signing.js
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif [ -f "$ENC" ]; then
            echo "::error::مفتاح التوقيع موجود لكن السر SIGNING_PASSPHRASE غير مضاف. لا نبني بمفتاح مختلف حتى لا ينكسر التحديث."
            exit 1
          else
            echo "::warning::لا يوجد مفتاح توقيع خاص (signing/raqeem-release.keystore.enc) — النسخة موقّعة بمفتاح debug ولا تصلح لـ Google Play. شغّل «Create Signing Key»."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK + AAB
        working-directory: apps/mobile/android
        env:
          RAQEEM_STORE_PASSWORD: ${{ secrets.SIGNING_PASSPHRASE }}
          RAQEEM_KEY_PASSWORD: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> gradle.properties
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          exit ${PIPESTATUS[0]}

      - name: Show error details
        if: failure()
        run: grep -n -i -E "error|exception|caused by|what went wrong" "$RUNNER_TEMP/gradle.log" | grep -v -i warning | head -120 || true

      - name: Collect outputs
        run: |
          mkdir -p out
          APKS=apps/mobile/android/app/build/outputs/apk/release
          cp "$APKS/app-arm64-v8a-release.apk" out/raqeem.apk
          cp "$APKS/app-armeabi-v7a-release.apk" out/raqeem-armv7.apk
          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab out/raqeem.aab
          APKSIGNER=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            echo "بصمة التوقيع (يجب أن تبقى ثابتة بين النسخ):"
            "$APKSIGNER" verify --print-certs out/raqeem.apk | grep -E 'DN|SHA-256' || true
          fi
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: raqeem-android-${{ github.run_number }}
          path: out/
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: رقيم لأندرويد — نسخة ${{ github.run_number }}
          body: |
            - raqeem.apk: للتثبيت المباشر على أغلب الهواتف (64 بت).
            - raqeem-armv7.apk: للهواتف القديمة (32 بت) إن لم يُثبَّت الأول.
            - raqeem.aab: للرفع إلى Google Play.
            التوقيع: ${{ steps.sign.outputs.mode == 'release' && 'مفتاح رقيم الخاص' || 'مفتاح debug (تجريبي، لا يصلح لـ Google Play)' }}
            الفرع: ${{ github.ref_name }} — الكود: ${{ github.sha }}
          prerelease: ${{ steps.sign.outputs.mode != 'release' }}
          files: |
            out/raqeem.apk
            out/raqeem-armv7.apk
            out/raqeem.aab

      # رابط تنزيل عام: المستودع خاص (روابط Releases لا تفتح للزبائن) وخطة Firebase المجانية تمنع ملفات APK.
      # الأساس: مستودع GitHub عام للإصدارات فقط (vars.RELEASES_REPO، بسر RELEASES_TOKEN) — بلا حد للتنزيل،
      # ورابط ثابت لآخر نسخة: https://github.com/<repo>/releases/latest/download/raqeem.apk
      # إن لم يُضبط بعد نرجع إلى مخزن Supabase العام «downloads» كما كان.
      - name: Publish APK on public GitHub Releases
        id: gh_public
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO: ${{ vars.RELEASES_REPO || 'makhzani2027/raqeem-app' }}
          RUN: ${{ github.run_number }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::notice::السر RELEASES_TOKEN غير مضاف — النشر عبر Supabase بدلاً من GitHub العام."; exit 0; fi
          # مستودع فارغ (بلا README) لا يقبل إصدارات: ننشئ أول ملف فيه
          if ! gh api "repos/$REPO/commits?per_page=1" >/dev/null 2>&1; then
            gh api -X PUT "repos/$REPO/contents/README.md" -f message="Add README" \
              -f content="$(printf '%s\n' '# رقيم — تطبيق أندرويد' '' 'تنزيل آخر نسخة: https://github.com/'"$REPO"'/releases/latest/download/raqeem.apk' | base64 -w0)" >/dev/null
            echo "✓ أُنشئ README في $REPO"
          fi
          tag="v1.0.$RUN"
          printf '%s\n' \
            "- raqeem.apk — لأغلب الهواتف (64 بت)." \
            "- raqeem-armv7.apk — للهواتف القديمة (32 بت) إن لم يُثبَّت الأول." \
            "" "يُثبَّت فوق النسخة السابقة دون فقدان البيانات." > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" out/raqeem.apk out/raqeem-armv7.apk --repo "$REPO" \
            --title "رقيم لأندرويد ${tag}" --notes-file "$RUNNER_TEMP/notes.md" --latest
          echo "url=https://github.com/$REPO/releases/latest/download/raqeem.apk" >> "$GITHUB_OUTPUT"
          echo "✓ رابط التنزيل الثابت: https://github.com/$REPO/releases/latest/download/raqeem.apk"

      - name: Supabase Storage (download link)
        id: supa
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ON_GITHUB: ${{ steps.gh_public.outputs.url != '' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            [ "$ON_GITHUB" = true ] || echo "::warning::لا أسرار Supabase ولا RELEASES_TOKEN — لم يُنشر رابط تنزيل عام (الملف في Releases الخاصة فقط)."
            exit 0
          fi
          keys=$(curl -sSf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true")
          KEY=$(echo "$keys" | jq -r '[.[] | select(.name=="service_role")][0].api_key // empty')
          [ -n "$KEY" ] || KEY=$(echo "$keys" | jq -r '[.[] | select(.type=="secret")][0].api_key // empty')
          [ -n "$KEY" ] || { echo "::error::تعذّر جلب مفتاح الخدمة من Supabase."; exit 1; }
          echo "::add-mask::$KEY"
          BASE="https://$PROJECT_REF.supabase.co/storage/v1"
          H=(-H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          if [ "$ON_GITHUB" = true ]; then
            # صار التنزيل من GitHub: نحذف النسخة القديمة من Supabase حتى لا تبقى رابطاً قديماً ولا تستهلك المساحة
            curl -sS -o /dev/null "${H[@]}" -H 'Content-Type: application/json' -X DELETE "$BASE/object/downloads" \
              -d '{"prefixes":["raqeem.apk","raqeem-armv7.apk"]}' || true
            echo "✓ حُذفت نسخة Supabase القديمة (التنزيل الآن من GitHub)."
            exit 0
          fi
          # المخزن عام للقراءة فقط؛ الكتابة بمفتاح الخدمة هنا وحده
          curl -sS -o /dev/null "${H[@]}" -H 'Content-Type: application/json' -X POST "$BASE/bucket" \
            -d '{"id":"downloads","name":"downloads","public":true}' || true
          for f in raqeem.apk raqeem-armv7.apk; do
            ls -lh "out/$f"
            curl -sS --fail-with-body -o /dev/null "${H[@]}" -X POST "$BASE/object/downloads/$f" \
              -H 'Content-Type: application/vnd.android.package-archive' -H 'x-upsert: true' -H 'cache-control: max-age=300' \
              --data-binary "@out/$f"
          done
          echo "url=https://$PROJECT_REF.supabase.co/storage/v1/object/public/downloads/raqeem.apk" >> "$GITHUB_OUTPUT"
          echo "✓ رابط التنزيل: https://$PROJECT_REF.supabase.co/storage/v1/object/public/downloads/raqeem.apk"

      - name: Update the website download button
        if: steps.gh_public.outputs.url != '' || steps.supa.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site.yml --ref "$GITHUB_REF_NAME"
