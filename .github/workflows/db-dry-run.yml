# تجربة جافة لـ migrations جديدة على قاعدة البيانات الحقيقية: داخل معاملة تنتهي بخطأ مقصود فلا يُحفظ شيء.
# تقارن محتوى كل جدول وتقارير المالك والزائر قبل/بعد. Actions ← DB Dry Run ← Run workflow.
name: DB Dry Run
on:
  workflow_dispatch:
    inputs:
      files:
        description: 'ملفات migrations (مسافة بينها)'
        required: true
        default: 'supabase/migrations/20261104000027_multi_store.sql supabase/migrations/20261104000028_store_signup.sql'

permissions:
  contents: read

jobs:
  dry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      FILES: ${{ inputs.files }}
    steps:
      - uses: actions/checkout@v4
      - name: Dry run (rolled back)
        run: |
          for f in $FILES; do [ -f "$f" ] || { echo "::error::غير موجود: $f"; exit 1; }; done
          bash supabase/maintenance/dryrun.sh $FILES > "$RUNNER_TEMP/dry.sql"
          jq -n --arg q "$(cat "$RUNNER_TEMP/dry.sql")" '{query: $q}' | curl -sS -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @- > "$RUNNER_TEMP/r.json" || true
          res=$(jq -r '.message // empty' "$RUNNER_TEMP/r.json" 2>/dev/null | sed -n 's/.*DRYRUN_RESULT \(.*\)$/\1/p' | head -1 || true)
          if [ -z "$res" ]; then echo "::error::لم تكتمل التجربة:"; cat "$RUNNER_TEMP/r.json"; exit 1; fi
          echo "$res" | jq . || echo "$res"
          echo "$res" | jq -e '.ok == true' >/dev/null || { echo "::error::يوجد اختلاف قبل/بعد — راجع diff أعلاه"; exit 1; }
          echo "✓ التجربة نجحت: لا تغيير في البيانات ولا التقارير، ولم يُحفظ شيء."
