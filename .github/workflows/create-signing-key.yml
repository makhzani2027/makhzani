# ينشئ مفتاح توقيع رقيم الخاص مرة واحدة ويحفظه مشفّراً في المستودع: signing/raqeem-release.keystore.enc
# الشرط: السر SIGNING_PASSPHRASE (جملة سرية طويلة يحفظها صاحب المشروع). لا يستبدل مفتاحاً موجوداً.
# تحذير: ضياع الجملة أو الملف = لا تحديث للتطبيق على Google Play ولا فوق النسخ المثبتة. احفظ نسخة خارج GitHub.
name: Create Signing Key
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create and encrypt the keystore
        run: |
          if [ -z "$SIGNING_PASSPHRASE" ] || [ "${#SIGNING_PASSPHRASE}" -lt 12 ]; then
            echo "::error::أضف السر SIGNING_PASSPHRASE (١٢ حرفاً فأكثر) في Settings ← Secrets and variables ← Actions."
            exit 1
          fi
          if [ -f signing/raqeem-release.keystore.enc ]; then
            echo "::error::مفتاح التوقيع موجود مسبقاً ولن يُستبدل (الاستبدال يكسر تحديث التطبيق)."
            exit 1
          fi
          mkdir -p signing
          ks="$RUNNER_TEMP/raqeem.keystore"
          keytool -genkeypair -keystore "$ks" -storetype PKCS12 -alias raqeem -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass:env SIGNING_PASSPHRASE -keypass:env SIGNING_PASSPHRASE -dname "CN=Raqeem, OU=Raqeem, O=Raqeem, C=IQ"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SIGNING_PASSPHRASE -in "$ks" -out signing/raqeem-release.keystore.enc
          # نتأكد أنه يُفك بالجملة نفسها
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SIGNING_PASSPHRASE -in signing/raqeem-release.keystore.enc -out "$RUNNER_TEMP/check.keystore"
          keytool -list -v -keystore "$RUNNER_TEMP/check.keystore" -storepass:env SIGNING_PASSPHRASE | grep -E "Alias|SHA256:"
          rm -f "$ks" "$RUNNER_TEMP/check.keystore"

      - name: Commit the encrypted key
        run: |
          git config user.name "raqeem-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signing/raqeem-release.keystore.enc
          git commit -m "Add encrypted Raqeem release signing key"
          pushed=false
          for i in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME" && git rebase "origin/$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && { pushed=true; break; }
            sleep $((i * 3))
          done
          [ "$pushed" = true ] || { echo "::error::تعذّر دفع المفتاح المشفّر إلى المستودع — لم يُحفظ. أعد تشغيل سير العمل."; exit 1; }
          echo "✓ تم. شغّل الآن Build Android؛ النسخ ستُوقَّع بالمفتاح الخاص."
