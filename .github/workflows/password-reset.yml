# رابط كلمة سر جديدة لحساب (احتياط إن لم يصل بريد «نسيت كلمة السر»). يدوي: Actions ← Password Reset Link ← Run workflow.
# الرابط يظهر في «Summary» لهذا التشغيل فقط (مخفي من السجل)، يُستعمل مرة واحدة، وينتهي خلال ساعة.
name: Password Reset Link
on:
  workflow_dispatch:
    inputs:
      email:
        description: 'بريد الحساب'
        required: true
permissions:
  contents: read
jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      EMAIL: ${{ inputs.email }}
    steps:
      - name: Generate link
        run: |
          set -euo pipefail
          email=$(printf '%s' "$EMAIL" | tr '[:upper:]' '[:lower:]' | xargs)
          printf '%s' "$email" | grep -Eq '^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$' || { echo "::error::بريد غير صالح"; exit 1; }
          api="https://api.supabase.com/v1/projects/$PROJECT_REF"
          cfg=$(curl -sS --fail-with-body "$api/config/auth" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          echo "site_url: $(echo "$cfg" | jq -r .site_url)"
          echo "redirect allow list: $(echo "$cfg" | jq -r .uri_allow_list)"
          key=$(curl -sS --fail-with-body "$api/api-keys?reveal=true" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.[] | select(.name=="service_role") | .api_key')
          echo "::add-mask::$key"
          res=$(jq -n --arg e "$email" '{type: "recovery", email: $e, redirect_to: "https://raqeem-iq.web.app/dashboard/"}' | curl -sS -X POST \
            "https://$PROJECT_REF.supabase.co/auth/v1/admin/generate_link" -H "apikey: $key" -H "Authorization: Bearer $key" -H "Content-Type: application/json" --data @-)
          link=$(echo "$res" | jq -r '.action_link // .properties.action_link // empty')
          if [ -z "$link" ]; then echo "::error::لا يوجد حساب بهذا البريد أو تعذّر إنشاء الرابط: $(echo "$res" | jq -r '.msg // .error_description // .message // "?"')"; exit 1; fi
          echo "::add-mask::$link"
          {
            echo "## رابط كلمة السر الجديدة لـ $email"
            echo ""
            echo "افتحه في المتصفح خلال ساعة (مرة واحدة)، ثم اكتب كلمة السر الجديدة:"
            echo ""
            echo "$link"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "تم: الرابط في صفحة Summary لهذا التشغيل."
